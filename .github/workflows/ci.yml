name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    - run: npm ci
    - run: npm test

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - run: npm run test:bun
